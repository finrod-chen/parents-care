# 每週一重新 build 並部署到 Cloudflare Pages，讓靜態 HTML 裡的「已截止」標示與
# 365 天查證檢查保持最新。
#
# 預設「關閉」：必須在 GitHub 的 Settings → Secrets and variables → Actions 設定
#   - Variables：DEPLOY_ENABLED = true
#   - Secrets：CLOUDFLARE_API_TOKEN（權限：Account → Cloudflare Pages → Edit）、CLOUDFLARE_ACCOUNT_ID
# 才會真的部署。網域（bamaling.tw）已綁定到 Cloudflare Pages 專案且確認要上線後，再開啟。
name: weekly-deploy

on:
  schedule:
    - cron: '0 0 * * 1' # 每週一 00:00 UTC（台灣時間週一 08:00）
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      # build 會先驗證 data/：欄位缺漏或 verified_at 超過 365 天會失敗，此時不會部署，線上維持舊版
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy dist --project-name=parents-care --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
